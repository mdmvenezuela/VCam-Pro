name: Build VCam RootHide

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build iOS Tweak for RootHide
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          brew install ldid xz dpkg

      - name: Install RootHide Theos
        run: |
          set -euo pipefail

          git clone --recursive \
            https://github.com/roothide/theos.git \
            "$HOME/theos"

          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Install iOS SDK
        run: |
          set -euo pipefail

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

          curl -fL "$SDK_URL" -o /tmp/sdk.tar.xz

          mkdir -p "$HOME/theos/sdks"

          tar -xf /tmp/sdk.tar.xz -C "$HOME/theos/sdks"

          echo "Installed SDKs:"
          ls -lh "$HOME/theos/sdks/"

          test -d "$HOME/theos/sdks/iPhoneOS16.5.sdk"

      - name: Build and validate VCam
        run: |
          set -euo pipefail

          echo "Cleaning previous build..."
          make clean

          echo "Building RootHide package..."
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide

          echo "Searching generated DEB..."
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

          if [ -z "$DEB" ]; then
            echo "ERROR: No DEB package was generated."
            exit 1
          fi

          echo "Generated package: $DEB"

          echo "Checking Debian architecture..."
          PACKAGE_ARCH="$(dpkg-deb -f "$DEB" Architecture)"

          echo "Package architecture: $PACKAGE_ARCH"

          if [ "$PACKAGE_ARCH" != "iphoneos-arm64e" ]; then
            echo "ERROR: Incorrect RootHide package architecture."
            exit 1
          fi

          mkdir -p output/unpacked

          cp "$DEB" output/

          echo "Extracting package..."
          dpkg-deb -x "$DEB" output/unpacked

          DYLIB="$(find output/unpacked -type f -name 'VCam.dylib' -print -quit)"

          if [ -z "$DYLIB" ]; then
            echo "ERROR: VCam.dylib was not found inside the DEB."
            exit 1
          fi

          echo "Found tweak: $DYLIB"

          echo "Checking compiled binary architecture..."
          BINARY_ARCHS="$(xcrun lipo -archs "$DYLIB")"

          echo "Binary architectures: $BINARY_ARCHS"

          case " $BINARY_ARCHS " in
            *" arm64 "*) ;;
            *)
              echo "ERROR: VCam.dylib does not contain arm64."
              exit 1
              ;;
          esac

          cp "$DYLIB" output/VCam.dylib

          rm -rf output/unpacked

          {
            echo "## VCam RootHide build"
            echo ""
            echo "- Package: $DEB"
            echo "- Debian architecture: $PACKAGE_ARCH"
            echo "- Binary architecture: $BINARY_ARCHS"
            echo "- Package validation: passed"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Build and validation completed successfully."

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: VCam-RootHide-DEB
          path: output/*.deb
          if-no-files-found: error
          retention-days: 30

      - name: Upload compiled dylib
        uses: actions/upload-artifact@v4
        with:
          name: VCam-RootHide-Dylib
          path: output/VCam.dylib
          if-no-files-found: error
          retention-days: 30
